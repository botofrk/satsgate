<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aipp.dev — Checkout</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: #0a0a0b;
    color: #f4f4f5;
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .header {
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
  }
  .header span { color: #ffc700; }

  .checkout-card {
    width: 100%;
    max-width: 440px;
    background: #121214;
    border: 1px solid #27272a;
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
  }

  .paywall-wrapper {
    width: 100%;
  }
</style>
</head>
<body>

  <div class="header">
    <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
      <rect width="32" height="32" rx="8" fill="#0f0f11"/>
      <circle cx="14" cy="16" r="7" fill="none" stroke="#ffc700" stroke-width="2.5"/>
      <circle cx="14" cy="16" r="2.5" fill="#ffc700"/>
      <path d="M19.5 12 L24 16 L19.5 20" fill="none" stroke="#ffc700" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    aipp<span>dev</span>
  </div>

  <div class="checkout-card">
    <div id="aipp-checkout-container" class="paywall-wrapper" data-aipp-src="/premium-article-1">
      <p style="text-align:center;color:#a1a1aa;font-size:13px;">Preparing checkout...</p>
    </div>
  </div>

  <script src="/paywall.js?v=12"></script>
  <script>
    // Smooth auto-scroll to checkout card on mobile/small screens
    document.addEventListener('DOMContentLoaded', () => {
      const card = document.querySelector('.checkout-card');
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    });
  </script>
</body>
</html>
