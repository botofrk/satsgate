<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">AIPP Tag Multi-Tool</title>
<desc id="desc">An original AIPP Smart Tag connected to three modules for selling links, tagging websites and charging API or agent calls.</desc>
<defs>
  <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#292724"/><stop offset="1" stop-color="#11110f"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#342d25" flood-opacity=".16"/></filter>
</defs>
<rect width="1000" height="520" rx="30" fill="#f8f5ef"/>
<text x="500" y="52" text-anchor="middle" font-family="Georgia,serif" font-size="36" fill="#181716">One tag. Three useful tools.</text>
<text x="500" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#746e68">Use only the module you need.</text>

<g fill="none" stroke="#cec5ba" stroke-width="4" stroke-linecap="round">
  <path d="M398 325C335 305 310 260 292 224"/>
  <path d="M500 294V211"/>
  <path d="M602 325C665 305 690 260 708 224"/>
</g>

<g font-family="Arial,sans-serif" filter="url(#shadow)">
  <rect x="52" y="132" width="270" height="132" rx="22" fill="#fffdf9" stroke="#dfd6cb" stroke-width="2"/>
  <rect x="52" y="132" width="8" height="132" rx="4" fill="#ffc700"/>
  <circle cx="94" cy="174" r="21" fill="#fffbdf"/><text x="94" y="181" text-anchor="middle" font-size="22" fill="#705800">↗</text>
  <text x="127" y="173" font-size="17" font-weight="800" fill="#181716">Sell a link or file</text>
  <text x="92" y="211" font-size="13" fill="#6f6a65">One checkout. Release the destination</text>
  <text x="92" y="232" font-size="13" fill="#6f6a65">after verified payment.</text>

  <rect x="365" y="106" width="270" height="132" rx="22" fill="#fffdf9" stroke="#dfd6cb" stroke-width="2"/>
  <rect x="365" y="106" width="8" height="132" rx="4" fill="#ffc700"/>
  <circle cx="407" cy="148" r="21" fill="#fffbdf"/><text x="407" y="155" text-anchor="middle" font-size="22" fill="#705800">●</text>
  <text x="440" y="147" font-size="17" font-weight="800" fill="#181716">Tag your website</text>
  <text x="405" y="185" font-size="13" fill="#6f6a65">Create and place a visual checkout</text>
  <text x="405" y="206" font-size="13" fill="#6f6a65">with the extension.</text>

  <rect x="678" y="132" width="270" height="132" rx="22" fill="#fffdf9" stroke="#dfd6cb" stroke-width="2"/>
  <rect x="940" y="132" width="8" height="132" rx="4" fill="#ffc700"/>
  <circle cx="720" cy="174" r="21" fill="#fffbdf"/><text x="720" y="181" text-anchor="middle" font-size="22" fill="#705800">⌁</text>
  <text x="753" y="173" font-size="17" font-weight="800" fill="#181716">Charge API / agent</text>
  <text x="718" y="211" font-size="13" fill="#6f6a65">Return HTTP 402, verify payment,</text>
  <text x="718" y="232" font-size="13" fill="#6f6a65">then continue the call.</text>
</g>

<g filter="url(#shadow)">
  <path d="M405 316Q405 294 427 294H573Q595 294 595 316V410Q595 432 573 432H427Q405 432 405 410Z" fill="url(#core)" stroke="#050504" stroke-width="3"/>
  <path d="M431 311H569" stroke="#514e49" stroke-width="3" stroke-linecap="round"/>
  <!-- Option 05 Logo Mark -->
  <g transform="translate(425, 335)">
    <circle cx="20" cy="20" r="14" stroke="#FFFFFF" stroke-width="3.8" stroke-dasharray="67 21" stroke-linecap="round" transform="rotate(-65 20 20)"/>
    <g transform="rotate(-38 20 20)">
      <path d="M 15 13.5 L 20 7.5 L 25 13.5 L 25 27 C 25 29 23.5 30.5 21.5 30.5 L 18.5 30.5 C 16.5 30.5 15 29 15 27 Z" fill="#F59E0B"/>
      <circle cx="20" cy="13" r="2.2" fill="#111111"/>
    </g>
  </g>
  <!-- Wordmark -->
  <text x="474" y="362" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5px">
    <tspan fill="#FFFFFF">ai</tspan><tspan fill="#F59E0B">pp</tspan>
  </text>
  <text x="475" y="380" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="500" fill="#a1a1aa" letter-spacing="1px">SMART TAG</text>
</g>

<text x="500" y="486" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" letter-spacing="2" fill="#918a83">ONE TAG · THREE JOBS · ZERO SUBSCRIPTION</text>
</svg>
